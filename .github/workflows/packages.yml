# Builds DigUp for Windows and Linux on x64: the shell's Windows installer, and its .deb and AppImage, kept as the run's
# artifacts (nothing is published). By hand: `gh workflow run packages.yml`, or `-f ref=<branch or tag>`. The Mac app is
# built and released on a Mac (scripts/release.sh).
name: Packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        default: main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends build-essential cmake ninja-build meson nasm pkg-config \
            patchelf file libfuse2t64 zlib1g-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Swift
        run: |
          version=6.4.0
          url=https://download.swift.org/swift-$version-release/ubuntu2404/swift-$version-RELEASE/swift-$version-RELEASE-ubuntu24.04.tar.gz
          curl -fsSL -o swift.tar.gz "$url"
          curl -fsSL -o swift.tar.gz.sig "$url.sig"
          curl -fsSL https://www.swift.org/keys/all-keys.asc | gpg --quiet --import
          gpg --verify swift.tar.gz.sig swift.tar.gz
          mkdir -p "$RUNNER_TEMP/swift"
          tar -xzf swift.tar.gz -C "$RUNNER_TEMP/swift" --strip-components 1
          rm swift.tar.gz swift.tar.gz.sig
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          scripts/fetch-vendor.sh
          scripts/build-llama.sh
          scripts/package-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DigUp-linux-x64
          path: |
            shell/src-tauri/target/release/bundle/deb/*.deb
            shell/src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: compnerd/gha-setup-swift@bbae8ce86bac5a3449f3992b3d88bc4ca25f2057 # v0.5.0
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          update-sdk-modules: true
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build
        shell: bash
        run: |
          # MSVC's tools before Git's: Git's /usr/bin/link (coreutils) would stand in for link.exe.
          export PATH="$(dirname "$(command -v cl)"):$PATH"
          # ffmpeg: BtbN's LGPL build with its DLLs, one dated build.
          ffmpeg=ffmpeg-n9.0.2-14-gebafaee10a-win64-lgpl-shared-9.0
          temp=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL -o "$temp/ffmpeg.zip" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-28-13-06/$ffmpeg.zip"
          echo "ca5dd7d0e35ec78936a92d766d59c9f5fc36b84699aec64e0fafbcf0b0603dd2  $temp/ffmpeg.zip" | sha256sum -c -
          unzip -q "$temp/ffmpeg.zip" -d "$temp"
          scripts/fetch-vendor.sh
          scripts/build-llama.sh
          FFMPEG="$temp/$ffmpeg/bin" scripts/package-windows.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DigUp-windows-x64
          path: shell/src-tauri/target/release/bundle/nsis/*.exe
